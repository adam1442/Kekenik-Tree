name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout v4
      - uses: actions/checkout@v7

      # actions/setup-node v4 (Node version comes from .nvmrc)
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Add README screenshot and SPA fallback
        run: |
          if [ -f ScreenShot.jpg ]; then cp ScreenShot.jpg dist/ScreenShot.jpg; fi
          cp dist/index.html dist/404.html

      # actions/configure-pages v5
      - uses: actions/configure-pages@v6

      # actions/upload-pages-artifact v3
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # actions/deploy-pages v4
      - id: deployment
        uses: actions/deploy-pages@v5
